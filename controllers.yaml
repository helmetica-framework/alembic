# Controller versions and upstream dirs, plus image tags.
#
# `dirs` are kustomize dirs, rendered with `kustomize build`. `files` are single
# YAML files, fetched raw. Both are relative to the upstream repo root.
#
# `order` is the file prefix (20_custos_crds, 21_custos). A controller without
# `order` is rendered by its own module, not the generic one.
# `namespace` and `repository` are optional overrides.
controllers:
  chrysopoeia:
    # renovate: datasource=github-tags depName=helmetica-framework/chrysopoeia
    version: v0.1.4
    # No order: rendered by the chrysopoeia module.
    dirs:
      crd: config/crd
      default: config/default
      proxy: config/proxy
      flux: config/flux
    files:
      espejote: config/proxy/permission-label-map-espejote.yaml
  custos:
    # renovate: datasource=github-tags depName=helmetica-framework/custos
    version: v0.1.2
    order: 20
    namespace: custos-system
    repository: helmetica-framework/custos
    dirs:
      crd: config/crd
      default: config/default
  ampulla:
    # renovate: datasource=github-tags depName=helmetica-framework/ampulla
    version: v0.1.1
    order: 30
    namespace: ampulla-system
    repository: helmetica-framework/ampulla
    dirs:
      crd: config/crd
      default: config/default
  adept:
    # renovate: datasource=github-tags depName=helmetica-framework/adept
    version: v0.1.0-dev7
    order: 40
    namespace: adept-system
    repository: helmetica-framework/adept
    dirs:
      crd: config/crd
      default: config/default
  sigillum:
    # renovate: datasource=github-tags depName=helmetica-framework/sigillum
    version: v0.2.0
    order: 50
    namespace: sigillum-system
    repository: helmetica-framework/sigillum
    dirs:
      crd: config/crd
      default: config/default
  libra:
    # renovate: datasource=github-tags depName=helmetica-framework/libra
    version: v0.0.1
    order: 60
    namespace: libra-system
    repository: helmetica-framework/libra
    dirs:
      crd: config/crd
      default: config/default

images:
  flux-source-controller:
    registry: ghcr.io
    repository: fluxcd/source-controller
    # renovate: datasource=docker depName=ghcr.io/fluxcd/source-controller
    tag: v1.10.1
  flux-image-reflector-controller:
    registry: ghcr.io
    repository: fluxcd/image-reflector-controller
    # renovate: datasource=docker depName=ghcr.io/fluxcd/image-reflector-controller
    tag: v1.3.0
  flux-helm-controller:
    registry: ghcr.io
    repository: fluxcd/helm-controller
    # renovate: datasource=docker depName=ghcr.io/fluxcd/helm-controller
    tag: v1.7.1
  alertmanager:
    registry: quay.io
    repository: prometheus/alertmanager
    # renovate: datasource=docker depName=quay.io/prometheus/alertmanager
    tag: v0.35.0
  prometheus:
    registry: quay.io
    repository: prometheus/prometheus
    # renovate: datasource=docker depName=quay.io/prometheus/prometheus
    tag: v3.16.0
  prometheus-operator:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator
    tag: v0.95.2
  # Ships with the operator release and must match its tag.
  prometheus-config-reloader:
    registry: quay.io
    repository: prometheus-operator/prometheus-config-reloader
    # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader
    tag: v0.95.2
